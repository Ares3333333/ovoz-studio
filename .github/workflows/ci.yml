name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Show the environment the suite is judged on
        run: python -c "import shutil,sys,platform;print(sys.version.strip());print(platform.platform());print('ffmpeg:', shutil.which('ffmpeg'))"
      - name: Run tests
        run: |
          set +e
          python -m pytest -q --tb=short | tee pytest.log
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            # Красный CI, который не называет себя, бесполезен для того, кто его
            # не запускал руками: подписанный URL журнала живёт вне API, а
            # `::error::` становится аннотацией, которую видно по запросу.
            grep -E '^(FAILED|ERROR)' pytest.log | head -25 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit $code
          fi
        env:
          OVOZ_SYNC_PIPELINE: "1"
      # Без этого красная задача остаётся нечитаемой для того, кто её не вводил
      # руками: лог живёт на подписанном URL, а аннотации и артефакт — в API.
      - name: Upload the pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t ovoz-studio:ci .
      - name: Smoke test container
        run: |
          docker run -d --name ovoz-ci -p 8080:8080 \
            -e OVOZ_SYNC_PIPELINE=1 \
            -e OVOZ_ADMIN_SECRET=ci-test-key \
            ovoz-studio:ci
          sleep 5
          curl -sf http://localhost:8080/healthz | grep '"ok":true'
          docker stop ovoz-ci && docker rm ovoz-ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app/ --select E,F,W --ignore E501 --output-format=github
